<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Un universo para ti</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#03050c;color:#f5f0e8;font-family:Georgia,'Times New Roman',serif}body:before{content:"";position:fixed;inset:0;background:radial-gradient(circle at 50% 42%,#0e1420 0,#060913 38%,#02040a 75%,#010207 100%);z-index:-3}.stars,.dust{position:fixed;inset:0;pointer-events:none}.stars{z-index:-2;background-image:radial-gradient(#fff 0.7px,transparent .8px),radial-gradient(#d8ddff .6px,transparent .7px),radial-gradient(#fff .45px,transparent .55px);background-size:79px 79px,113px 113px,47px 47px;background-position:5px 17px,41px 61px,23px 7px;opacity:.55;animation:drift 45s linear infinite}.dust{z-index:-1;background:radial-gradient(ellipse at 15% 70%,rgba(52,66,103,.13),transparent 28%),radial-gradient(ellipse at 80% 25%,rgba(65,51,86,.1),transparent 25%)}@keyframes drift{to{transform:translateY(79px)}}
#app{height:100%;position:relative}.brand{position:fixed;top:24px;left:50%;transform:translateX(-50%);z-index:20;text-align:center;letter-spacing:.35em;text-transform:uppercase;font-size:9px;color:#e7e0d2;opacity:.8;white-space:nowrap}.brand small{display:block;font-size:5px;margin-top:6px;letter-spacing:.28em;opacity:.55}.scene{position:absolute;inset:0;display:grid;place-items:center;padding:75px 20px 65px;opacity:0;visibility:hidden;transform:scale(.985);transition:opacity .9s ease,transform 1.1s ease,visibility 0s 1s}.scene.active{opacity:1;visibility:visible;transform:scale(1);transition-delay:0s}.content{width:min(760px,92vw);height:min(650px,78vh);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;position:relative}.eyebrow{font-size:9px;letter-spacing:.42em;text-transform:uppercase;margin-bottom:18px;opacity:.6}.title{font-size:clamp(34px,6vw,68px);font-style:italic;font-weight:400;margin:0 0 14px;text-shadow:0 0 25px rgba(255,255,255,.06)}.lead{font-size:clamp(17px,2.2vw,27px);line-height:1.35;margin:0;max-width:700px}.sub{font-size:clamp(12px,1.5vw,17px);line-height:1.55;opacity:.78;max-width:560px}.btn{margin-top:34px;border:1px solid rgba(255,255,255,.2);background:rgba(2,4,10,.45);color:#f5f0e8;border-radius:999px;padding:10px 24px;font:12px Georgia;cursor:pointer;letter-spacing:.05em;box-shadow:inset 0 0 20px rgba(255,255,255,.025);transition:.3s}.btn:hover{border-color:rgba(255,255,255,.55);transform:translateY(-1px)}
.constellation{width:min(310px,55vw);height:220px;margin:10px auto 26px;filter:drop-shadow(0 0 5px rgba(255,255,255,.3))}.constellation line{fill:none;stroke:#eee9dc;stroke-width:1.2;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1}.scene.active .constellation line{animation:joinPoint .3s linear forwards;animation-delay:calc(var(--i)*.24s)}.constellation circle{fill:#fff;opacity:0;filter:drop-shadow(0 0 4px #fff)}.scene.active .constellation circle{animation:pop .2s ease forwards;animation-delay:calc(var(--i)*.24s)}@keyframes joinPoint{to{stroke-dashoffset:0}}@keyframes pop{to{opacity:1}}
.world{width:230px;height:230px;border-radius:50%;position:relative;margin:20px auto 28px;background:radial-gradient(circle at 32% 25%,#72733e 0,#555a35 12%,#313b2e 35%,#17211f 59%,#0b1114 76%,#03070a 100%);box-shadow:inset -35px -25px 55px #010306,inset 18px 12px 30px rgba(177,175,82,.15),0 0 45px rgba(65,78,57,.09);animation:float 5s ease-in-out infinite}.world:after{content:"";position:absolute;inset:0;border-radius:50%;background:linear-gradient(115deg,rgba(255,255,190,.12),transparent 35%,rgba(0,0,0,.28) 70%)}@keyframes float{50%{transform:translateY(-8px)}}
.garden{position:absolute;left:50%;bottom:76%;transform:translateX(-50%);display:flex;align-items:flex-end;justify-content:center;width:310px;height:135px;z-index:3}.flower{position:relative;width:42px;height:120px;margin:0 -7px;transform-origin:bottom center;animation:sway 3.5s ease-in-out infinite alternate}.flower:nth-child(even){animation-delay:-1.4s;transform:scale(.88)}.flower:nth-child(3n){animation-delay:-2.2s;transform:scale(1.06)}.stem{position:absolute;width:3px;height:75px;background:linear-gradient(#758c46,#30472e);bottom:0;left:20px;transform:rotate(var(--r,0deg));transform-origin:bottom}.stem:after{content:"";position:absolute;width:18px;height:8px;border-radius:100% 0 100% 0;background:#405d34;left:-15px;top:42px;transform:rotate(-25deg)}.head{position:absolute;top:6px;left:5px;width:34px;height:34px;filter:drop-shadow(0 0 5px rgba(230,183,46,.2))}.petal{position:absolute;left:13px;top:1px;width:9px;height:16px;border-radius:70% 30% 70% 30%;background:linear-gradient(#ffd74c,#e6a81d);transform-origin:4px 16px}.petal:nth-child(1){transform:rotate(0)}.petal:nth-child(2){transform:rotate(45deg)}.petal:nth-child(3){transform:rotate(90deg)}.petal:nth-child(4){transform:rotate(135deg)}.petal:nth-child(5){transform:rotate(180deg)}.petal:nth-child(6){transform:rotate(225deg)}.petal:nth-child(7){transform:rotate(270deg)}.petal:nth-child(8){transform:rotate(315deg)}.core{position:absolute;width:14px;height:14px;border-radius:50%;background:radial-gradient(circle,#5d3b18,#24160b);left:10px;top:10px;z-index:2}@keyframes sway{to{rotate:2deg}}
.hint{position:absolute;bottom:34px;font-size:9px;letter-spacing:.18em;text-transform:uppercase;opacity:.55}.progress{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);font-size:8px;letter-spacing:.3em;opacity:.35;z-index:20}.label{position:absolute;z-index:5;font-style:italic;font-size:13px;opacity:0;transition:.5s;pointer-events:none;text-shadow:0 2px 5px #000}.flower:hover+.label{opacity:1}.golden{position:fixed;inset:0;pointer-events:none;z-index:4;overflow:hidden}.golden i{position:absolute;color:#d7ad35;font-style:normal;opacity:0;animation:fall 7s linear infinite;text-shadow:0 0 8px rgba(255,202,48,.25)}@keyframes fall{0%{opacity:0;transform:translateY(-8vh) rotate(0)}10%{opacity:.7}100%{opacity:0;transform:translateY(108vh) rotate(260deg)}}.finalbig{font-size:clamp(32px,6vw,68px);line-height:1.1;max-width:820px}.fadeup{animation:fadeup 1.1s ease both}@keyframes fadeup{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@media(max-width:600px){.brand{top:18px}.content{height:76vh}.world{width:180px;height:180px}.garden{transform:translateX(-50%) scale(.8);bottom:72%}.lead{font-size:19px}.btn{margin-top:24px}.constellation{height:170px}.progress{bottom:15px}}
.music{position:fixed;right:22px;top:20px;z-index:50;width:32px;height:32px;border:1px solid rgba(255,255,255,.14);border-radius:50%;display:grid;place-items:center;background:rgba(3,5,12,.5);color:#eee8dd;cursor:pointer;opacity:.66;transition:.25s}.music:hover{opacity:1}.music.off:after{content:"";position:absolute;width:18px;height:1px;background:#eee8dd;transform:rotate(-45deg)}
.flash{position:fixed;inset:0;background:#f3ead6;opacity:0;pointer-events:none;z-index:80}.flash.on{animation:sceneFlash .85s ease both}@keyframes sceneFlash{0%{opacity:0}28%{opacity:.94}100%{opacity:0}}
.scene{filter:blur(7px)}.scene.active{filter:blur(0)}
.world{background:radial-gradient(circle at 30% 23%,#7a7c48 0,#5e633d 11%,#3d4934 29%,#26342d 45%,#16221f 61%,#0b1315 77%,#03070a 100%)}
.world:before{content:"";position:absolute;inset:0;border-radius:50%;background:repeating-radial-gradient(ellipse at 38% 28%,rgba(209,199,116,.05) 0 2px,transparent 3px 10px);mix-blend-mode:screen}
.golden i:nth-child(4n){color:#f4ce5a}
.stars{z-index:0;opacity:.72;background-image:radial-gradient(circle,#fff 0 .7px,transparent .9px),radial-gradient(circle,#aeb9df 0 .65px,transparent .85px),radial-gradient(circle,#fff 0 .45px,transparent .65px),radial-gradient(circle,#7983a5 0 .5px,transparent .75px);background-size:53px 47px,89px 83px,31px 37px,127px 111px;background-position:7px 13px,33px 51px,17px 5px,71px 23px}.dust{z-index:0}#app{z-index:1}
.scene.type-world .content,.scene.type-gold .content{justify-content:center;padding-bottom:38px}.scene.type-world .world,.scene.type-gold .world{margin:14px auto 15px}.scene.type-world .garden,.scene.type-gold .garden{bottom:66%;height:106px;width:255px}.scene.type-world .flower,.scene.type-gold .flower{width:31px;height:90px;margin:0 -5px}.scene.type-world .stem,.scene.type-gold .stem{height:55px;left:15px}.scene.type-world .head,.scene.type-gold .head{width:28px;height:28px;left:1px;top:7px}.scene.type-world .petal,.scene.type-gold .petal{left:10px;width:8px;height:13px;transform-origin:4px 13px}.scene.type-world .core,.scene.type-gold .core{width:12px;height:12px;left:8px;top:8px}.scene.type-world .stem:after,.scene.type-gold .stem:after{width:14px;height:6px;left:-11px;top:31px}.scene.type-world .btn,.scene.type-gold .btn{margin-top:10px}.scene.type-world .hint,.scene.type-gold .hint{bottom:-7px}.scene.type-world .flower:nth-child(2n),.scene.type-gold .flower:nth-child(2n){translate:0 7px}.scene.type-world .flower:nth-child(3n),.scene.type-gold .flower:nth-child(3n){translate:0 2px}.scene.type-world .flower:nth-child(4n),.scene.type-gold .flower:nth-child(4n){translate:0 10px}
@media(max-height:720px){.scene.type-world .content,.scene.type-gold .content{transform:scale(.88)}.scene.type-world .hint,.scene.type-gold .hint{bottom:-15px}}
.scene{width:100%;height:100%;inset:0}.content{height:auto;max-height:calc(100vh - 125px);min-height:0;justify-content:center}.hint{position:static;bottom:auto;margin-top:18px;min-height:11px;flex:0 0 auto}.scene.type-world .content,.scene.type-gold .content{padding-bottom:0}.scene.type-world .hint,.scene.type-gold .hint{bottom:auto;margin-top:18px}.scene.type-world .btn,.scene.type-gold .btn{margin-top:12px}.scene.type-heart .btn{margin-top:27px}.scene.type-heart .hint{margin-top:18px}
@media(max-height:720px){.scene.type-world .content,.scene.type-gold .content{transform:none}.content{max-height:calc(100vh - 94px)}.world{width:190px;height:190px;margin:8px auto 8px}.scene.type-world .garden,.scene.type-gold .garden{bottom:65%;transform:translateX(-50%) scale(.88)}.scene.type-world .btn,.scene.type-gold .btn{margin-top:7px}.hint,.scene.type-world .hint,.scene.type-gold .hint{margin-top:10px}.constellation{height:176px;margin:0 auto 12px}.scene.type-heart .btn{margin-top:18px}}
@media(max-height:590px){.brand{top:12px}.scene{padding-top:58px;padding-bottom:38px}.content{transform:scale(.82)!important;max-height:none}.progress{bottom:8px}.music{top:12px;right:12px}}
.scene.type-world .garden,.scene.type-gold .garden{display:block;width:270px;height:104px;bottom:65%;overflow:visible}.scene.type-world .flower,.scene.type-gold .flower{position:absolute;left:var(--x);bottom:var(--y);width:31px;height:88px;margin:0;opacity:0;scale:1;translate:none;rotate:0;animation:none;transform-origin:50% 100%}.scene.active.type-world .flower,.scene.active.type-gold .flower{animation:sprout .72s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:calc(var(--i)*.13s)}.scene.type-world .flower:nth-child(n),.scene.type-gold .flower:nth-child(n){translate:none;scale:1}@keyframes sprout{0%{opacity:0;transform:translateY(25px) scale(.32)}55%{opacity:1;transform:translateY(-3px) scale(calc(var(--s)*1.05))}100%{opacity:1;transform:translateY(0) scale(var(--s))}}
.scene.type-world .head,.scene.type-gold .head{left:-13px;top:-14px;transform-origin:50% 50%;animation:flowerSway 3.2s ease-in-out infinite alternate;animation-delay:calc(var(--i)*-.37s)}@keyframes flowerSway{from{rotate:-2deg}to{rotate:3deg}}
.scene.type-world:has(.garden.selectable) .world{margin-top:34px}.scene.active .garden.selectable .flower{cursor:pointer;transition:opacity .55s ease,filter .55s ease}.scene.active .garden.selectable.has-choice .flower:not(.chosen){opacity:.22!important;filter:grayscale(.75) brightness(.62)}.scene.active .garden.selectable .flower.chosen{animation:none!important;opacity:1!important;z-index:20;transform:translateY(-11px) scale(1.28)!important;filter:drop-shadow(0 0 7px rgba(255,220,86,.95)) drop-shadow(0 0 18px rgba(255,184,30,.62));transition:transform .65s cubic-bezier(.2,.9,.2,1),filter .65s ease}.scene.active .garden.selectable .flower.chosen .head{animation:chosenGlow 1.1s ease-in-out infinite alternate}@keyframes chosenGlow{from{rotate:-3deg;filter:drop-shadow(0 0 2px #ffd85a)}to{rotate:3deg;filter:drop-shadow(0 0 9px #ffe785)}}.unique-message{transition:opacity .35s,transform .35s}.unique-message.revealed{color:#fff;opacity:1;transform:scale(1.08);text-shadow:0 0 13px rgba(255,221,107,.35)}
.scene.type-gold .title{font-size:clamp(32px,4.8vw,58px);max-width:760px}.scene.type-gold .sub{font-size:clamp(13px,1.35vw,18px);line-height:1.55}
.credit{position:fixed;right:20px;bottom:18px;z-index:35;font:italic 9px Georgia,'Times New Roman',serif;letter-spacing:.08em;color:#d8d2c8;opacity:.38;white-space:nowrap;pointer-events:none;text-shadow:0 1px 5px #000}@media(max-width:600px){.credit{right:10px;bottom:9px;font-size:7px;opacity:.32}}
</style></head><body><div class="stars"></div><div class="dust"></div><div id="app"><div class="brand">UN UNIVERSO PARA TI<small>UN LUGAR QUE SOLO EXISTE CONTIGO</small></div><button class="music off" id="music" aria-label="Activar o silenciar música" title="Música">♫</button><div class="golden" id="golden"></div><div class="flash" id="flash"></div><div id="scenes"></div><div class="progress" id="progress"></div><div class="credit">Desarrollado por Kevin Eduardo</div></div><audio id="song" src="musica-universo.m4a" preload="auto" loop></audio><script>
const phrases=[
 {type:'intro',eye:'ENTRE MILLONES DE ESTRELLAS',title:'Estefany...',sub:'Encontré algo en el universo que quería mostrarte.',btn:'Descubrir'},
 {type:'heart',text:'Dicen que hay millones de estrellas...'},
 {type:'heart',text:'pero ninguna podría<br>iluminar mi vida como tú.'},
 {type:'heart',text:'Mi estrella favorita<br>siempre serás tú, Bichita.'},
 {type:'world',text:'Viajé un poco más lejos...',flowers:0},
 {type:'world',text:'Entonces entendí algo...',flowers:1},
 {type:'world',text:'No importa cuántos lugares existan...',flowers:5},
 {type:'world',text:'Siempre elegiría aquel donde estés tú.',flowers:8,labels:true},
 {type:'gold',text:'Podría regalarte todas<br>las flores del mundo...',flowers:4},
 {type:'gold',text:'pero preferí regalarte<br>un universo entero.',flowers:5},
 {type:'gold',title:'Feliz 21 de septiembre',sub:'Día de las flores amarillas.<br>Te prometo dártelas cuando me lo permitas<br>y te vea TE AMO. &lt;3',flowers:8},
];
function heart(){const pts=[[150,188],[92,140],[63,96],[74,50],[110,34],[150,72],[190,34],[226,50],[237,96],[208,140],[150,188]];const lines=pts.slice(0,-1).map((p,i)=>`<line pathLength="1" x1="${p[0]}" y1="${p[1]}" x2="${pts[i+1][0]}" y2="${pts[i+1][1]}" style="--i:${i}"/>`).join('');const dots=pts.slice(0,-1).map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="2.1" style="--i:${i}"/>`).join('');return `<svg class="constellation" viewBox="0 0 300 220">${lines}${dots}</svg>`}
function flower(i){const x=[18,47,77,108,139,169,199,227],y=[1,9,15,19,18,14,8,1],s=[.82,.96,.86,1.08,.88,1.02,.92,.8],r=[-12,-8,-4,1,4,7,10,13];return `<div class="flower" style="--i:${i};--x:${x[i%8]}px;--y:${y[i%8]}px;--s:${s[i%8]};--r:${r[i%8]}deg"><div class="stem"><div class="head" style="--i:${i}">${'<b class="petal"></b>'.repeat(8)}<b class="core"></b></div></div></div>`}
function world(n,labels){let fs=Array.from({length:n},(_,i)=>flower(i)).join('');return `<div class="world"><div class="garden${labels?' selectable':''}">${fs}</div></div>${labels?'<div class="sub unique-message" style="font-style:italic;margin-top:-18px">Toca una flor ♥</div>':''}`}
const host=document.getElementById('scenes');phrases.forEach((p,i)=>{let inner='';if(p.type==='intro')inner=`<div class="eyebrow">${p.eye}</div><h1 class="title">${p.title}</h1><p class="sub">${p.sub}</p>`;if(p.type==='heart')inner=`${heart()}<p class="lead">${p.text}</p>`;if(['world','gold'].includes(p.type))inner=`${p.title?`<h2 class="title" style="font-style:normal">${p.title}</h2>`:''}${p.text?`<p class="lead" style="margin-bottom:8px">${p.text}</p>`:''}${p.sub?`<p class="sub">${p.sub}</p>`:''}${world(p.flowers,p.labels)}`;let s=document.createElement('section');s.className=`scene type-${p.type}`;s.innerHTML=`<div class="content fadeup">${inner}${i<phrases.length-1?`<button class="btn">${p.btn||'Continuar'}　↗</button>`:'<button class="btn">Volver a empezar　↺</button>'}<div class="hint">${p.type==='world'?'LO QUE FLORECE':'SIEMPRE TÚ'}</div></div>`;host.appendChild(s)});
let idx=0,lock=false,started=false;const scenes=[...document.querySelectorAll('.scene')],prog=document.getElementById('progress'),gold=document.getElementById('golden'),song=document.getElementById('song'),music=document.getElementById('music'),flash=document.getElementById('flash');function render(){scenes.forEach((s,i)=>s.classList.toggle('active',i===idx));prog.textContent=String(idx+1).padStart(2,'0')+'　—　'+String(scenes.length).padStart(2,'0');gold.innerHTML='';if(phrases[idx].type==='gold'){for(let i=0;i<62;i++){let e=document.createElement('i');e.textContent=i%4?'✽':'✦';e.style.left=Math.random()*100+'%';e.style.animationDelay=-Math.random()*8+'s';e.style.animationDuration=(5+Math.random()*5)+'s';e.style.fontSize=(6+Math.random()*10)+'px';gold.appendChild(e)}}if(idx===3){flash.classList.remove('on');void flash.offsetWidth;flash.classList.add('on')}}function startSong(){if(started)return;started=true;song.volume=.82;song.play().then(()=>music.classList.remove('off')).catch(()=>started=false)}function go(n){if(lock)return;lock=true;startSong();idx=(n+scenes.length)%scenes.length;render();setTimeout(()=>lock=false,700)}document.addEventListener('click',e=>{const chosen=e.target.closest('.garden.selectable .flower');if(chosen){const garden=chosen.closest('.garden');garden.querySelectorAll('.flower').forEach(f=>f.classList.remove('chosen'));garden.classList.add('has-choice');chosen.classList.add('chosen');const message=chosen.closest('.scene').querySelector('.unique-message');message.innerHTML='Entre todas, <strong>siempre tú.</strong> ♥';message.classList.add('revealed');return}if(e.target.closest('.btn'))go(idx===scenes.length-1?0:idx+1)});music.addEventListener('click',e=>{e.stopPropagation();if(song.paused){started=false;startSong()}else{song.pause();music.classList.add('off')}});document.addEventListener('keydown',e=>{if(['ArrowRight',' ','Enter'].includes(e.key))go(idx+1);if(e.key==='ArrowLeft')go(idx-1)});let sy=0;document.addEventListener('touchstart',e=>sy=e.touches[0].clientY,{passive:true});document.addEventListener('touchend',e=>{let d=sy-e.changedTouches[0].clientY;if(Math.abs(d)>45)go(idx+(d>0?1:-1))},{passive:true});document.addEventListener('wheel',e=>{if(Math.abs(e.deltaY)>35)go(idx+(e.deltaY>0?1:-1))},{passive:true});document.addEventListener('pointermove',e=>{document.querySelector('.stars').style.transform=`translate(${(e.clientX/innerWidth-.5)*7}px,${(e.clientY/innerHeight-.5)*7}px) scale(1.02)`},{passive:true});render();
</script></body></html>
